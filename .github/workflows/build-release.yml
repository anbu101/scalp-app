name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# ======================================================================
# STORAGE-FREE RELEASE MODEL
# ----------------------------------------------------------------------
# This workflow uploads installers DIRECTLY to GitHub Releases from each
# build job — it does NOT use actions/upload-artifact at all. GitHub
# Actions *artifact storage* (the 500 MB Free-tier bucket that was hitting
# "Artifact storage quota has been hit") is therefore never touched.
# Release *assets* live in a separate, far larger bucket.
#
# Flow:
#   check-flags      -> decides which of the THREE targets build this release
#   create-releases  -> creates the EMPTY release (with body) in BOTH repos
#                       (scalp-app + scalp-releases) exactly once, so the
#                       release notes are written a single time with no race
#   build-* jobs     -> build as before, then APPEND their installers to
#                       both releases (scalp-app via GITHUB_TOKEN,
#                       scalp-releases via RELEASES_REPO_TOKEN)
#
# ----------------------------------------------------------------------
# BUILD_SELECTION (per-target opt-in markers)
# ----------------------------------------------------------------------
# Each of the three targets is gated by a marker in the commit OR tag
# message:
#   [arm]   -> macOS Apple Silicon
#   [intel] -> macOS Intel
#   [win]   -> Windows
# RULE: NO markers => build ALL THREE (a bare tag still ships a full set).
#       ANY marker  => build ONLY the marked targets.
# Intel remains continue-on-error so an Intel failure never blocks the rest.
#
# ----------------------------------------------------------------------
# ONEDIR PACKAGING (changed from --onefile)
# ----------------------------------------------------------------------
# PyInstaller now emits a DIRECTORY (dist/scalp-backend/) containing the
# launcher + _internal/. We copy its CONTENTS into
# desktop/src-tauri/backend/ so the launcher stays at
# desktop/src-tauri/backend/scalp-backend (unchanged for Tauri /
# runtime.rs) with _internal/ beside it. Smoke tests launch the binary at
# its in-place path inside backend/.
#
# ----------------------------------------------------------------------
# WINDOWS _ssl FIX (added)
# ----------------------------------------------------------------------
# The Windows job now (1) prints where CI Python's OpenSSL DLLs live before
# PyInstaller runs, and (2) HARD-FAILS the build if libssl*/libcrypto* DLLs
# are not bundled into _internal/. This catches the "_ssl: Invalid access to
# memory location" crash that only manifests on clean Windows machines (the
# CI runner has the DLLs system-wide, so the old smoke test passed falsely).
#
# ----------------------------------------------------------------------
# WINDOWS_SSL_STRIP_FIX (added 2026-06-29)
# ----------------------------------------------------------------------
# The OpenSSL-DLLs-bundled guard could still false-pass: a stripped/corrupt
# DLL is present-but-broken. The guard now ALSO asserts each DLL is a
# plausible size (>=100 KB), so a corrupted/zeroed copy fails the build.
# Paired with strip=False in scalp-backend.spec, this is the real fix for
# the regression where clean Windows machines crash on _ssl import.
# ======================================================================

jobs:
  # ----------------------------------------------------------------------
  # Gate job: read commit/tag message and decide which of the three targets
  # build this release.
  # ----------------------------------------------------------------------
  check-flags:
    runs-on: ubuntu-latest
    outputs:
      include_arm: ${{ steps.flags.outputs.include_arm }}
      include_intel: ${{ steps.flags.outputs.include_intel }}
      include_windows: ${{ steps.flags.outputs.include_windows }}
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # BUILD_SELECTION BEGIN
      # Per-target opt-in markers in the commit OR tag-annotation message:
      #   [arm]    -> macOS Apple Silicon build
      #   [intel]  -> macOS Intel build
      #   [win]    -> Windows build
      #
      # RULE: if NONE of the markers are present, build ALL THREE (a bare
      # release tag still ships a full set — no silent empty release). If ANY
      # marker is present, build ONLY the marked targets. So markers are a
      # filter you opt into, not a requirement on every tag.
      #
      # Examples:
      #   git tag v1.2.3 -m "release"                -> arm + intel + win
      #   git tag v1.2.3 -m "hotfix [win]"           -> windows only
      #   git tag v1.2.3 -m "macs [arm] [intel]"     -> both macs, no windows
      #   git tag v1.2.3 -m "arm + win [arm] [win]"  -> arm + windows
      - name: Parse build-selection markers
        id: flags
        run: |
          TAG="${GITHUB_REF_NAME}"
          COMMIT_MSG="$(git log -1 --pretty=%B 2>/dev/null || true)"
          TAG_MSG="$(git for-each-ref "refs/tags/${TAG}" --format='%(contents)' 2>/dev/null || true)"
          MSG="${COMMIT_MSG} ${TAG_MSG}"
          echo "Tag: ${TAG}"
          echo "----- commit message -----"
          echo "${COMMIT_MSG}"
          echo "----- tag annotation -----"
          echo "${TAG_MSG}"
          echo "--------------------------"

          has_arm=false;   echo "$MSG" | grep -qi '\[arm\]'   && has_arm=true
          has_intel=false; echo "$MSG" | grep -qi '\[intel\]' && has_intel=true
          has_win=false;   echo "$MSG" | grep -qi '\[win\]'   && has_win=true

          if ! $has_arm && ! $has_intel && ! $has_win; then
            echo "No build markers found — building ALL THREE (arm + intel + windows)."
            inc_arm=true; inc_intel=true; inc_win=true
          else
            echo "Build markers present — building ONLY the marked targets."
            inc_arm=$has_arm; inc_intel=$has_intel; inc_win=$has_win
          fi

          echo "include_arm=${inc_arm}"        >> "$GITHUB_OUTPUT"
          echo "include_intel=${inc_intel}"    >> "$GITHUB_OUTPUT"
          echo "include_windows=${inc_win}"    >> "$GITHUB_OUTPUT"

          echo "Resolved -> arm=${inc_arm}  intel=${inc_intel}  windows=${inc_win}"
      # BUILD_SELECTION END

      # >>> AUTO_UPDATER_20260821 BEGIN (pubkey guard) <<<
      # Hard gate: never ship a build whose updater pubkey is still the
      # placeholder — installed apps would reject every future update.
      - name: Guard — updater pubkey configured
        run: |
          if grep -q "REPLACE_WITH_TAURI_UPDATER_PUBKEY" desktop/src-tauri/tauri.conf.json; then
            echo "ERROR: tauri.conf.json still contains the updater pubkey placeholder."
            echo "Run 'npm run tauri signer generate' locally, paste the PUBLIC key into"
            echo "plugins.updater.pubkey, and add the private key as repo secrets"
            echo "TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
            exit 1
          fi
          echo "Updater pubkey present."
      # >>> AUTO_UPDATER_20260821 END <<<

  # ----------------------------------------------------------------------
  # Create the (empty) release in BOTH repos, once, with the body/notes.
  # Build jobs then only append files — so the release notes are written
  # exactly once and never raced/overwritten by parallel uploads.
  # softprops/action-gh-release is idempotent: if the release already
  # exists (e.g. a retry), it updates rather than failing.
  # ----------------------------------------------------------------------
  create-releases:
    needs: check-flags
    runs-on: ubuntu-latest
    steps:
      - name: Create release in scalp-app (private source repo)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## Installation Notes

            **macOS (Apple Silicon):** Download `.dmg` or `.app.tar.gz` (no `-intel` suffix)
            - For M1/M2/M3/M4 Macs
            - macOS 11.0 (Big Sur) or later required

            **macOS (Intel):** Download the `-intel.dmg` or `-intel.app.tar.gz`
            - For Intel-based Macs
            - macOS 11.0 (Big Sur) or later required
            - Note: Intel builds are published only for releases that include them.

            **Windows:** Download `-setup.exe`
            - Requires Windows 10 or later (64-bit)
            - Note: Windows builds are published only for releases that include them.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # >>> DRAFT_RELEASE_20260827 BEGIN (D6: draft-until-complete) <<<
      # The updater endpoint reads scalp-releases/releases/latest. A published
      # release becomes "latest" the moment it is created — 10-25 min before
      # its assets/manifests exist — so any updater check in that window 404s
      # and falls back to the manual link. Creating the release as a DRAFT
      # keeps it invisible to releases/latest until the final job publishes it
      # after all manifests are in place. All scalp-releases interactions use
      # the gh CLI because it reliably addresses draft releases by tag.
      - name: Create DRAFT release in scalp-releases (public installers repo)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" -R anbu101/scalp-releases >/dev/null 2>&1; then
            echo "Release ${TAG} already exists in scalp-releases — reusing (retry run)."
            exit 0
          fi
          gh release create "$TAG" -R anbu101/scalp-releases --draft \
            --title "$TAG" --notes-file - <<'NOTES'
          Scalp Terminal ${{ github.ref_name }}

          **macOS (Apple Silicon):** `.dmg` or `.app.tar.gz` (no `-intel` suffix) — M1/M2/M3/M4.
          **macOS (Intel):** `-intel.dmg` / `-intel.app.tar.gz` — only present when the release includes an Intel build.
          **Windows:** `-setup.exe` — Windows 10+ (64-bit) — only present when the release includes a Windows build.
          NOTES
          echo "Draft release ${TAG} created in scalp-releases."
      # >>> DRAFT_RELEASE_20260827 END <<<

  build-macos:
    needs: [check-flags, create-releases]
    # BUILD_SELECTION BEGIN
    if: needs.check-flags.outputs.include_arm == 'true'
    # BUILD_SELECTION END
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Sync Frontend Source
        run: |
          mkdir -p desktop/src-tauri/frontend
          rsync -av --exclude='node_modules' \
                    --exclude='build' \
                    --exclude='.git' \
                    --exclude='.env' \
                    --exclude='*.log' \
                    frontend/ desktop/src-tauri/frontend/
          echo "Frontend synced to desktop/src-tauri/frontend/"

      - name: Build Frontend
        run: |
          cd desktop/src-tauri/frontend
          npm install
          npm run build
          echo "Frontend built at desktop/src-tauri/frontend/build/"
          ls -la build/

      - name: Copy Frontend for Tauri
        run: |
          mkdir -p desktop/frontend/build
          cp -r desktop/src-tauri/frontend/build/* desktop/frontend/build/
          echo "Frontend copied to desktop/frontend/build/"
          ls -la desktop/frontend/build/

      - name: Sync Backend Source
        run: |
          mkdir -p desktop/src-tauri/backend
          rsync -av --exclude='__pycache__' \
                    --exclude='*.pyc' \
                    --exclude='.pytest_cache' \
                    --exclude='venv' \
                    --exclude='dist' \
                    --exclude='build' \
                    --exclude='.git' \
                    --exclude='.env' \
                    --exclude='*.log' \
                    backend/ desktop/src-tauri/backend/
          echo "Backend synced to desktop/src-tauri/backend/"

      - name: Build Backend Binary (PyInstaller - arm64, onedir)
        run: |
          cd desktop/src-tauri/backend
          pip install -r requirements.txt
          pip install pyinstaller==6.3.0
          pyinstaller scalp-backend.spec --clean --noconfirm

          # ONEDIR: PyInstaller emits dist/scalp-backend/ (a directory:
          # launcher + _internal/). Copy its CONTENTS into the backend/
          # folder so the launcher lands at ./scalp-backend with _internal/
          # beside it (Tauri bundles the whole backend/ dir as resources).
          cp -R dist/scalp-backend/. ./
          chmod +x scalp-backend

          echo "Backend launcher created:"
          file scalp-backend
          lipo -info scalp-backend
          ls -lh scalp-backend
          echo "_internal present?"
          ls -la _internal | head -5


      - name: Verify backtest modules bundled (macOS) — HARD FAIL
        run: |
          cd desktop/src-tauri/backend
          TOC=build/scalp-backend/Analysis-00.toc
          REQUIRED="
            app.backtest.data.candle_source
            app.backtest.engine.backtest_selector
            app.backtest.charges.charges_model
            app.backtest.scalpv5.backtest_scalpv5_runner
            app.backtest.runner.backtest_runner
            app.backtest.runner.backtest_hedge_runner
            app.backtest.bb.backtest_bb_runner
            app.backtest.repo.backtest_repo
            app.backtest.repo.backtest_queue_repo
            app.backtest.queue_worker
            app.backtest.tma.backtest_tma_v2_runner
            app.engine.tma2.tma2_selection_loop
            app.engine.orb.orb_live_core
            app.engine.orb.orb_manager
            app.engine.orb.orb_engine
            app.engine.orb.orb_runtime
            app.jobs.orb_live_eod
            app.api.orb_state_routes
            app.engine.vet.vet_selection_loop
            app.engine.vet.vet_manager
            app.api.vet_state_routes
            app.jobs.vet_live_eod
            app.engine.brk.brk_runtime
            app.engine.brk.brk_manager
            app.engine.brk.brk_engine
            app.engine.brk.brk_live_core
            app.api.brk_v1_state_routes
            app.jobs.brk_live_eod
            app.jobs.liveness_ping
          "
          MISSING=0
          for m in $REQUIRED; do
            if grep -q "$m" "$TOC"; then echo "OK   $m"; else echo "MISS $m"; MISSING=1; fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "ERROR: backtest modules missing from macOS bundle — would crash on Run. Failing."
            exit 1
          fi
          echo "All required backtest modules are bundled (macOS)."

      - name: Smoke-test backend binary (arm64)
        run: |
          cd desktop/src-tauri/backend
          echo "Launching backend to confirm it starts..."
          ./scalp-backend &
          BACK_PID=$!
          sleep 8
          if ! kill -0 "$BACK_PID" 2>/dev/null; then
            echo "Backend exited within 8s — startup/bundling problem (e.g. missing hidden import)"
            wait "$BACK_PID" 2>/dev/null
            exit 1
          fi
          echo "Backend still running after 8s — startup OK"
          kill "$BACK_PID" 2>/dev/null || true
          sleep 2

      - name: Verify Bundle Structure
        run: |
          echo "=== Verifying desktop/src-tauri structure ==="
          ls -la desktop/src-tauri/
          echo "=== Frontend build exists? ==="
          ls -la desktop/src-tauri/frontend/build/ | head -5
          echo "=== Backend launcher + _internal exist? ==="
          ls -la desktop/src-tauri/backend/scalp-backend
          ls -la desktop/src-tauri/backend/_internal | head -5

      # >>> AUTO_UPDATER_20260821 BEGIN (version from tag) <<<
      # The updater compares the manifest version against the app's own
      # version (tauri.conf.json). Patch it from the tag so they can never
      # diverge (a stale conf version would cause an endless update loop).
      - name: Set app version from tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cd desktop/src-tauri
          jq --arg v "$VER" '.version = $v' tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp tauri.conf.json
          echo "tauri.conf.json version -> $VER"
          jq -r '.version' tauri.conf.json
      # >>> AUTO_UPDATER_20260821 END <<<

      - name: Install Desktop Dependencies
        run: |
          cd desktop
          npm install

      - name: Build Tauri App (ARM only)
        run: |
          cd desktop/src-tauri
          npm run tauri build -- --target aarch64-apple-darwin

      - name: Fix backend executable permission (macOS)
        run: |
          BACKEND_BIN="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Scalp.app/Contents/Resources/backend/scalp-backend"
          chmod +x "$BACKEND_BIN"
          ls -l "$BACKEND_BIN"

      - name: Clear quarantine on app and backend
        run: |
          xattr -dr com.apple.quarantine \
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Scalp.app

      - name: Create DMG
        run: |
          cd desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          create-dmg \
            --volname "Scalp" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "Scalp-${{ github.ref_name }}.dmg" \
            "Scalp.app" || true

      - name: Create tarball
        run: |
          cd desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          tar -czf "Scalp-${{ github.ref_name }}.app.tar.gz" Scalp.app

      # >>> AUTO_UPDATER_20260821 BEGIN (arm updater assets) <<<
      # Sign the MANUAL tarball (created after chmod +x backend and xattr
      # clear — Tauri's auto updater-artifact would be generated BEFORE those
      # fixes and ship a non-executable backend). Then emit the per-platform
      # manifest with a tag-pinned URL so copy-forward keeps working.
      - name: Sign updater artifact + build manifest (darwin-aarch64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          BUNDLE="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          FILE="Scalp-${TAG}.app.tar.gz"
          # SIGNER_KEYFILE_FIX_20260821: `tauri signer sign` does not reliably
          # read the TAURI_SIGNING_* env vars (unlike `tauri build`) — pass the
          # key explicitly via a temp keyfile. Guard against an empty secret so
          # a misconfigured secret fails with a clear message, not a CLI riddle.
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "ERROR: TAURI_SIGNING_PRIVATE_KEY secret is empty or not set on scalp-app."
            exit 1
          fi
          echo "Signing key present (${#TAURI_SIGNING_PRIVATE_KEY} chars)."
          KEYFILE="$(mktemp)"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEYFILE"
          cd desktop
          npm run tauri signer sign -- -f "$KEYFILE" -p "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" "$PWD/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/${FILE}"
          cd ..
          rm -f "$KEYFILE"
          test -s "${BUNDLE}/${FILE}.sig" || { echo "ERROR: signature not produced"; exit 1; }
          SIG="$(cat "${BUNDLE}/${FILE}.sig")"
          URL="https://github.com/anbu101/scalp-releases/releases/download/${TAG}/${FILE}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg v "${TAG#v}" --arg d "$DATE" --arg u "$URL" --arg s "$SIG" \
            '{version:$v, pub_date:$d, platforms:{"darwin-aarch64":{url:$u, signature:$s}}}' \
            > "${BUNDLE}/latest-darwin-aarch64.json"
          echo "Manifest:"
          cat "${BUNDLE}/latest-darwin-aarch64.json"

      - name: Publish updater assets to scalp-releases (darwin-aarch64)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # DRAFT_RELEASE_20260827: gh addresses the draft by tag; softprops
          # cannot, and would create a duplicate published release. Unmatched
          # globs stay literal and make gh fail = fail_on_unmatched preserved.
          gh release upload "${GITHUB_REF_NAME}" -R anbu101/scalp-releases --clobber \
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Scalp-${{ github.ref_name }}.app.tar.gz.sig \
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/latest-darwin-aarch64.json
      # >>> AUTO_UPDATER_20260821 END <<<

      # --- Upload installers DIRECTLY to both releases (no artifact storage) ---
      - name: Publish macOS installers to scalp-app release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.dmg
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish macOS installers to scalp-releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # DRAFT_RELEASE_20260827: gh addresses the draft by tag; softprops
          # cannot, and would create a duplicate published release. Unmatched
          # globs stay literal and make gh fail = fail_on_unmatched preserved.
          gh release upload "${GITHUB_REF_NAME}" -R anbu101/scalp-releases --clobber \
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.dmg \
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz

  build-macos-intel:
    needs: [check-flags, create-releases]
    # BUILD_SELECTION BEGIN
    # Intel opt-in via [intel] marker (or no-markers => all three). The Intel
    # job alone bills ~270 macOS minutes (10x multiplier), so it stays off
    # unless selected.
    if: needs.check-flags.outputs.include_intel == 'true'
    # BUILD_SELECTION END
    runs-on: macos-15-intel
    # Non-blocking: an Intel failure must NOT stop the ARM + Windows release.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Sync Frontend Source
        run: |
          mkdir -p desktop/src-tauri/frontend
          rsync -av --exclude='node_modules' \
                    --exclude='build' \
                    --exclude='.git' \
                    --exclude='.env' \
                    --exclude='*.log' \
                    frontend/ desktop/src-tauri/frontend/
          echo "Frontend synced to desktop/src-tauri/frontend/"

      - name: Build Frontend
        run: |
          cd desktop/src-tauri/frontend
          npm install
          npm run build
          echo "Frontend built at desktop/src-tauri/frontend/build/"
          ls -la build/

      - name: Copy Frontend for Tauri
        run: |
          mkdir -p desktop/frontend/build
          cp -r desktop/src-tauri/frontend/build/* desktop/frontend/build/
          echo "Frontend copied to desktop/frontend/build/"
          ls -la desktop/frontend/build/

      - name: Sync Backend Source
        run: |
          mkdir -p desktop/src-tauri/backend
          rsync -av --exclude='__pycache__' \
                    --exclude='*.pyc' \
                    --exclude='.pytest_cache' \
                    --exclude='venv' \
                    --exclude='venv-x86' \
                    --exclude='dist' \
                    --exclude='build' \
                    --exclude='.git' \
                    --exclude='.env' \
                    --exclude='*.log' \
                    backend/ desktop/src-tauri/backend/
          echo "Backend synced to desktop/src-tauri/backend/"

      - name: Build Backend Binary (PyInstaller - x86_64 native, onedir)
        run: |
          cd desktop/src-tauri/backend
          pip install -r requirements.txt
          pip install pyinstaller==6.3.0
          pyinstaller scalp-backend.spec --clean --noconfirm

          # ONEDIR: copy dist/scalp-backend/ CONTENTS into backend/ so the
          # launcher lands at ./scalp-backend with _internal/ beside it.
          cp -R dist/scalp-backend/. ./
          chmod +x scalp-backend

          echo "Backend launcher created:"
          file scalp-backend
          lipo -info scalp-backend
          ls -lh scalp-backend
          echo "_internal present?"
          ls -la _internal | head -5


      - name: Verify backtest modules bundled (macOS) — HARD FAIL
        run: |
          cd desktop/src-tauri/backend
          TOC=build/scalp-backend/Analysis-00.toc
          REQUIRED="
            app.backtest.data.candle_source
            app.backtest.engine.backtest_selector
            app.backtest.charges.charges_model
            app.backtest.scalpv5.backtest_scalpv5_runner
            app.backtest.runner.backtest_runner
            app.backtest.runner.backtest_hedge_runner
            app.backtest.bb.backtest_bb_runner
            app.backtest.repo.backtest_repo
            app.backtest.repo.backtest_queue_repo
            app.backtest.queue_worker
            app.backtest.tma.backtest_tma_v2_runner
            app.engine.tma2.tma2_selection_loop
            app.engine.orb.orb_live_core
            app.engine.orb.orb_manager
            app.engine.orb.orb_engine
            app.engine.orb.orb_runtime
            app.jobs.orb_live_eod
            app.api.orb_state_routes
            app.engine.vet.vet_selection_loop
            app.engine.vet.vet_manager
            app.api.vet_state_routes
            app.jobs.vet_live_eod
            app.engine.brk.brk_runtime
            app.engine.brk.brk_manager
            app.engine.brk.brk_engine
            app.engine.brk.brk_live_core
            app.api.brk_v1_state_routes
            app.jobs.brk_live_eod
            app.jobs.liveness_ping
          "
          MISSING=0
          for m in $REQUIRED; do
            if grep -q "$m" "$TOC"; then echo "OK   $m"; else echo "MISS $m"; MISSING=1; fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "ERROR: backtest modules missing from macOS bundle — would crash on Run. Failing."
            exit 1
          fi
          echo "All required backtest modules are bundled (macOS)."
          
      - name: Smoke-test backend binary (Intel x86_64)
        run: |
          cd desktop/src-tauri/backend
          echo "Launching backend to confirm it starts..."
          ./scalp-backend &
          BACK_PID=$!
          sleep 8
          if ! kill -0 "$BACK_PID" 2>/dev/null; then
            echo "Backend exited within 8s — startup/bundling problem (this is what jaraco caused)"
            wait "$BACK_PID" 2>/dev/null
            exit 1
          fi
          echo "Backend still running after 8s — startup OK"
          kill "$BACK_PID" 2>/dev/null || true
          sleep 2

      - name: Verify x86_64 backend binary
        run: |
          cd desktop/src-tauri/backend
          ARCH=$(lipo -info scalp-backend | grep -o 'x86_64' || true)
          if [ "$ARCH" != "x86_64" ]; then
            echo "Backend binary is not x86_64 (got: $(lipo -info scalp-backend))"
            exit 1
          fi
          echo "Verified x86_64 backend binary"

      - name: Verify Bundle Structure
        run: |
          echo "=== Verifying desktop/src-tauri structure ==="
          ls -la desktop/src-tauri/
          echo "=== Frontend build exists? ==="
          ls -la desktop/src-tauri/frontend/build/ | head -5
          echo "=== Backend launcher + _internal exist? ==="
          ls -la desktop/src-tauri/backend/scalp-backend
          ls -la desktop/src-tauri/backend/_internal | head -5

      # >>> AUTO_UPDATER_20260821 BEGIN (version from tag) <<<
      # The updater compares the manifest version against the app's own
      # version (tauri.conf.json). Patch it from the tag so they can never
      # diverge (a stale conf version would cause an endless update loop).
      - name: Set app version from tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cd desktop/src-tauri
          jq --arg v "$VER" '.version = $v' tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp tauri.conf.json
          echo "tauri.conf.json version -> $VER"
          jq -r '.version' tauri.conf.json
      # >>> AUTO_UPDATER_20260821 END <<<

      - name: Install Desktop Dependencies
        run: |
          cd desktop
          npm install

      - name: Build Tauri App (Intel x86_64)
        run: |
          cd desktop/src-tauri
          npm run tauri build -- --target x86_64-apple-darwin

      - name: Fix backend executable permission (macOS)
        run: |
          BACKEND_BIN="desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Scalp.app/Contents/Resources/backend/scalp-backend"
          chmod +x "$BACKEND_BIN"
          ls -l "$BACKEND_BIN"

      - name: Clear quarantine on app and backend
        run: |
          xattr -dr com.apple.quarantine \
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Scalp.app

      - name: Create DMG (Intel)
        run: |
          cd desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos
          create-dmg \
            --volname "Scalp" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "Scalp-${{ github.ref_name }}-intel.dmg" \
            "Scalp.app" || true

      - name: Create tarball (Intel)
        run: |
          cd desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos
          tar -czf "Scalp-${{ github.ref_name }}-intel.app.tar.gz" Scalp.app

      # >>> AUTO_UPDATER_20260821 BEGIN (intel updater assets) <<<
      - name: Sign updater artifact + build manifest (darwin-x86_64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          BUNDLE="desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos"
          FILE="Scalp-${TAG}-intel.app.tar.gz"
          # SIGNER_KEYFILE_FIX_20260821: `tauri signer sign` does not reliably
          # read the TAURI_SIGNING_* env vars (unlike `tauri build`) — pass the
          # key explicitly via a temp keyfile. Guard against an empty secret so
          # a misconfigured secret fails with a clear message, not a CLI riddle.
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "ERROR: TAURI_SIGNING_PRIVATE_KEY secret is empty or not set on scalp-app."
            exit 1
          fi
          echo "Signing key present (${#TAURI_SIGNING_PRIVATE_KEY} chars)."
          KEYFILE="$(mktemp)"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEYFILE"
          cd desktop
          npm run tauri signer sign -- -f "$KEYFILE" -p "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" "$PWD/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/${FILE}"
          cd ..
          rm -f "$KEYFILE"
          test -s "${BUNDLE}/${FILE}.sig" || { echo "ERROR: signature not produced"; exit 1; }
          SIG="$(cat "${BUNDLE}/${FILE}.sig")"
          URL="https://github.com/anbu101/scalp-releases/releases/download/${TAG}/${FILE}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg v "${TAG#v}" --arg d "$DATE" --arg u "$URL" --arg s "$SIG" \
            '{version:$v, pub_date:$d, platforms:{"darwin-x86_64":{url:$u, signature:$s}}}' \
            > "${BUNDLE}/latest-darwin-x86_64.json"
          echo "Manifest:"
          cat "${BUNDLE}/latest-darwin-x86_64.json"

      - name: Publish updater assets to scalp-releases (darwin-x86_64)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # DRAFT_RELEASE_20260827: gh addresses the draft by tag; softprops
          # cannot, and would create a duplicate published release. Unmatched
          # globs stay literal and make gh fail = fail_on_unmatched preserved.
          gh release upload "${GITHUB_REF_NAME}" -R anbu101/scalp-releases --clobber \
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Scalp-${{ github.ref_name }}-intel.app.tar.gz.sig \
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/latest-darwin-x86_64.json
      # >>> AUTO_UPDATER_20260821 END <<<

      # --- Upload Intel installers DIRECTLY to both releases ---
      - name: Publish Intel installers to scalp-app release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.dmg
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Intel installers to scalp-releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # DRAFT_RELEASE_20260827: gh addresses the draft by tag; softprops
          # cannot, and would create a duplicate published release. Unmatched
          # globs stay literal and make gh fail = fail_on_unmatched preserved.
          gh release upload "${GITHUB_REF_NAME}" -R anbu101/scalp-releases --clobber \
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.dmg \
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.tar.gz

  build-windows:
    needs: [check-flags, create-releases]
    # BUILD_SELECTION BEGIN
    if: needs.check-flags.outputs.include_windows == 'true'
    # BUILD_SELECTION END
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync Frontend Source
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/frontend
          cp -r frontend/* desktop/src-tauri/frontend/ 2>/dev/null || true
          rm -rf desktop/src-tauri/frontend/node_modules 2>/dev/null || true
          rm -rf desktop/src-tauri/frontend/build 2>/dev/null || true
          echo "Frontend synced to desktop/src-tauri/frontend/"

      - name: Build Frontend
        run: |
          cd desktop/src-tauri/frontend
          npm install
          npm run build

      - name: Copy Frontend for Tauri
        shell: bash
        run: |
          mkdir -p desktop/frontend/build
          cp -r desktop/src-tauri/frontend/build/* desktop/frontend/build/
          echo "Frontend copied to desktop/frontend/build/"

      - name: Sync Backend Source
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/backend
          cp -r backend/. desktop/src-tauri/backend/
          rm -rf desktop/src-tauri/backend/__pycache__ \
                 desktop/src-tauri/backend/venv \
                 desktop/src-tauri/backend/dist \
                 desktop/src-tauri/backend/build 2>/dev/null || true
          # Safety net: a lossy copy can drop 0-byte __init__.py package markers
          # (this is exactly what removed app/backtest/data on Windows). Recreate
          # a marker in every app/ subdirectory that lacks one, so PyInstaller's
          # collect_submodules sees every package.
          find desktop/src-tauri/backend/app -type d | while read -r d; do
            if [ ! -f "$d/__init__.py" ]; then
              : > "$d/__init__.py"
              echo "recreated marker: $d/__init__.py"
            fi
          done
          echo "Backend synced + package markers ensured."

      - name: Verify package markers synced (Windows)
        shell: bash
        run: |
          cd desktop/src-tauri/backend
          for d in app/backtest/data app/backtest/engine app/backtest/scalpv5 \
                   app/backtest/repo app/backtest/runner app/backtest/dhan \
                   app/backtest/bb app/backtest/sim app/backtest/util \
                   app/backtest/charges app/backtest/backfill; do
            if [ ! -f "$d/__init__.py" ]; then
              echo "ERROR: missing $d/__init__.py after sync — PyInstaller won't collect this package."
              exit 1
            fi
          done
          echo "All backtest package __init__.py markers present."

      # --- Windows _ssl fix: show where CI Python's OpenSSL DLLs live, so we
      #     can confirm the spec's glob will pick them up. Non-fatal. ---
      - name: Debug — locate OpenSSL DLLs in CI Python
        shell: bash
        run: |
          echo "pythonLocation=$pythonLocation"
          echo "--- searching for libssl*/libcrypto* under pythonLocation ---"
          find "$pythonLocation" -iname 'libssl*.dll' -o -iname 'libcrypto*.dll' 2>/dev/null \
            || echo "none found under pythonLocation"
          echo "--- ssl module reports ---"
          python -c "import ssl; print('OpenSSL:', ssl.OPENSSL_VERSION)"

      - name: Build Backend Binary (PyInstaller, onedir)
        shell: bash
        run: |
          cd desktop/src-tauri/backend
          pip install -r requirements.txt
          pip install pyinstaller==6.3.0
          pyinstaller scalp-backend.spec --clean --noconfirm

          # ONEDIR: PyInstaller emits dist/scalp-backend/ (directory:
          # scalp-backend.exe + _internal/). Copy its CONTENTS into backend/
          # so the launcher lands at ./scalp-backend.exe with _internal/
          # beside it (Tauri bundles the whole backend/ dir as resources).
          cp -R dist/scalp-backend/. ./
          echo "Backend launcher created:"
          ls -lh scalp-backend.exe
          echo "_internal present?"
          ls -la _internal | head -5

      - name: Verify backtest modules bundled (Windows) — HARD FAIL
        shell: bash
        run: |
          cd desktop/src-tauri/backend
          TOC=build/scalp-backend/Analysis-00.toc
          echo "=== app.backtest modules in the Windows .toc ==="
          grep -oE "app\.backtest\.[a-zA-Z0-9_.]+" "$TOC" | sort -u
          echo "=== Asserting the runtime-critical modules are present ==="
          REQUIRED="
            app.backtest.data.candle_source
            app.backtest.engine.backtest_selector
            app.backtest.charges.charges_model
            app.backtest.scalpv5.backtest_scalpv5_runner
            app.backtest.runner.backtest_runner
            app.backtest.runner.backtest_hedge_runner
            app.backtest.bb.backtest_bb_runner
            app.backtest.repo.backtest_repo
            app.backtest.repo.backtest_queue_repo
            app.backtest.queue_worker
            app.backtest.tma.backtest_tma_v2_runner
            app.engine.tma2.tma2_selection_loop
            app.engine.orb.orb_live_core
            app.engine.orb.orb_manager
            app.engine.orb.orb_engine
            app.engine.orb.orb_runtime
            app.jobs.orb_live_eod
            app.api.orb_state_routes
            app.engine.vet.vet_selection_loop
            app.engine.vet.vet_manager
            app.api.vet_state_routes
            app.jobs.vet_live_eod
            app.engine.brk.brk_runtime
            app.engine.brk.brk_manager
            app.engine.brk.brk_engine
            app.engine.brk.brk_live_core
            app.api.brk_v1_state_routes
            app.jobs.brk_live_eod
            app.jobs.liveness_ping
          "
          MISSING=0
          for m in $REQUIRED; do
            if grep -q "$m" "$TOC"; then
              echo "OK   $m"
            else
              echo "MISS $m"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo ""
            echo "ERROR: one or more backtest modules are NOT in the Windows bundle."
            echo "The app would crash with ModuleNotFoundError when a backtest runs."
            echo "Failing the build so this never ships to users."
            exit 1
          fi
          echo "All required backtest modules are bundled."

      # --- Windows _ssl fix: HARD-FAIL if OpenSSL DLLs are not bundled into
      #     _internal/. This is the check that prevents shipping a build that
      #     crashes with "_ssl: Invalid access to memory location" on a clean
      #     machine. The CI runner has these DLLs system-wide, so the runtime
      #     smoke test below can pass falsely — THIS step is the real guard. ---
      # WINDOWS_SSL_STRIP_FIX BEGIN
      # Hardened: presence alone is not enough — a stripped/corrupt DLL is
      # present-but-broken and would still false-pass the old check. Now we
      # also assert each DLL is a plausible size (>=100 KB). Paired with
      # strip=False in the spec, this guarantees a loadable bundled _ssl.
      - name: Verify OpenSSL DLLs bundled (Windows)
        shell: bash
        run: |
          cd desktop/src-tauri/backend
          echo "Checking _internal/ for bundled OpenSSL DLLs..."
          shopt -s nullglob
          ssl_dlls=( _internal/libssl*.dll )
          crypto_dlls=( _internal/libcrypto*.dll )
          echo "libssl matches:   ${ssl_dlls[*]:-<none>}"
          echo "libcrypto matches: ${crypto_dlls[*]:-<none>}"
          if [ ${#ssl_dlls[@]} -eq 0 ] || [ ${#crypto_dlls[@]} -eq 0 ]; then
            echo "ERROR: OpenSSL DLLs missing from _internal/."
            echo "_ssl will fail with 'Invalid access to memory location' on machines"
            echo "without system OpenSSL. Failing the build."
            echo "--- anything ssl/crypto-ish in _internal: ---"
            ls _internal | grep -iE 'ssl|crypto' || echo "(nothing)"
            exit 1
          fi
          MIN_BYTES=100000
          for f in "${ssl_dlls[@]}" "${crypto_dlls[@]}"; do
            sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "  $f = ${sz} bytes"
            if [ "${sz:-0}" -lt "$MIN_BYTES" ]; then
              echo "ERROR: $f is only ${sz} bytes (< ${MIN_BYTES}) — likely stripped/corrupt."
              echo "This is the regression that crashed clean Windows machines."
              echo "Confirm strip=False in scalp-backend.spec. Failing the build."
              exit 1
            fi
          done
          echo "OK: OpenSSL DLLs bundled AND reasonably sized — _ssl will load on clean Windows machines."
          ls -la _internal/libssl*.dll _internal/libcrypto*.dll
      # WINDOWS_SSL_STRIP_FIX END

      - name: Smoke-test backend binary (Windows)
        shell: bash
        run: |
          cd desktop/src-tauri/backend
          echo "Launching backend to confirm it starts..."
          ./scalp-backend.exe &
          BACK_PID=$!
          sleep 8
          if ! kill -0 "$BACK_PID" 2>/dev/null; then
            echo "Backend exited within 8s — startup/bundling problem"
            exit 1
          fi
          echo "Backend still running after 8s — startup OK"
          taskkill //F //PID "$BACK_PID" 2>/dev/null || kill "$BACK_PID" 2>/dev/null || true
          sleep 2

      - name: Verify Bundle Structure
        shell: bash
        run: |
          echo "=== Verifying desktop/src-tauri structure ==="
          ls -la desktop/src-tauri/
          echo "=== Frontend build exists? ==="
          ls -la desktop/src-tauri/frontend/build/ | head -5
          echo "=== Backend launcher + _internal exist? ==="
          ls -la desktop/src-tauri/backend/scalp-backend.exe
          ls -la desktop/src-tauri/backend/_internal | head -5

      # >>> AUTO_UPDATER_20260821 BEGIN (version from tag) <<<
      # The updater compares the manifest version against the app's own
      # version (tauri.conf.json). Patch it from the tag so they can never
      # diverge (a stale conf version would cause an endless update loop).
      - name: Set app version from tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cd desktop/src-tauri
          jq --arg v "$VER" '.version = $v' tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp tauri.conf.json
          echo "tauri.conf.json version -> $VER"
          jq -r '.version' tauri.conf.json
      # >>> AUTO_UPDATER_20260821 END <<<

      - name: Install Desktop Dependencies
        run: |
          cd desktop
          npm install

      - name: Build Tauri App
        run: |
          cd desktop/src-tauri
          npm run tauri build

      - name: List build outputs
        shell: bash
        run: |
          echo "=== Listing all bundle outputs ==="
          ls -R desktop/src-tauri/target/release/bundle/ || echo "No bundle directory"

      # >>> AUTO_UPDATER_20260821 BEGIN (windows updater assets) <<<
      # D4: NSIS is the update vehicle (installMode=passive). MSI was dropped
      # (DROP_MSI_20260827) — setup.exe is now the only Windows artifact, for
      # both manual install and auto-update.
      - name: Sign updater artifact + build manifest (windows-x86_64)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          NSIS_DIR="desktop/src-tauri/target/release/bundle/nsis"
          shopt -s nullglob
          exes=( "$NSIS_DIR"/*-setup.exe )
          if [ ${#exes[@]} -ne 1 ]; then
            echo "ERROR: expected exactly one NSIS setup.exe, found: ${exes[*]:-<none>}"
            exit 1
          fi
          FILE_PATH="${exes[0]}"
          FILE="$(basename "$FILE_PATH")"
          # SIGNER_KEYFILE_FIX_20260821: `tauri signer sign` does not reliably
          # read the TAURI_SIGNING_* env vars (unlike `tauri build`) — pass the
          # key explicitly via a temp keyfile. Guard against an empty secret so
          # a misconfigured secret fails with a clear message, not a CLI riddle.
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "ERROR: TAURI_SIGNING_PRIVATE_KEY secret is empty or not set on scalp-app."
            exit 1
          fi
          echo "Signing key present (${#TAURI_SIGNING_PRIVATE_KEY} chars)."
          KEYFILE="$(mktemp)"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEYFILE"
          cd desktop
          npm run tauri signer sign -- -f "$KEYFILE" -p "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" "$PWD/src-tauri/target/release/bundle/nsis/${FILE}"
          cd ..
          rm -f "$KEYFILE"
          test -s "${FILE_PATH}.sig" || { echo "ERROR: signature not produced"; exit 1; }
          SIG="$(cat "${FILE_PATH}.sig")"
          URL="https://github.com/anbu101/scalp-releases/releases/download/${TAG}/${FILE}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg v "${TAG#v}" --arg d "$DATE" --arg u "$URL" --arg s "$SIG" \
            '{version:$v, pub_date:$d, platforms:{"windows-x86_64":{url:$u, signature:$s}}}' \
            > "$NSIS_DIR/latest-windows-x86_64.json"
          echo "Manifest:"
          cat "$NSIS_DIR/latest-windows-x86_64.json"

      - name: Publish updater assets to scalp-releases (windows-x86_64)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # DRAFT_RELEASE_20260827: gh addresses the draft by tag; softprops
          # cannot, and would create a duplicate published release. Unmatched
          # globs stay literal and make gh fail = fail_on_unmatched preserved.
          gh release upload "${GITHUB_REF_NAME}" -R anbu101/scalp-releases --clobber \
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig \
            desktop/src-tauri/target/release/bundle/nsis/latest-windows-x86_64.json
      # >>> AUTO_UPDATER_20260821 END <<<

      # --- Upload Windows installers DIRECTLY to both releases ---
      - name: Publish Windows installers to scalp-app release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Windows installers to scalp-releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # DRAFT_RELEASE_20260827: gh addresses the draft by tag; softprops
          # cannot, and would create a duplicate published release. Unmatched
          # globs stay literal and make gh fail = fail_on_unmatched preserved.
          gh release upload "${GITHUB_REF_NAME}" -R anbu101/scalp-releases --clobber \
            desktop/src-tauri/target/release/bundle/nsis/*.exe

  # >>> AUTO_UPDATER_20260821 BEGIN (manifest copy-forward, D2-b) <<<
  # Per-platform manifest files let each platform's updater version advance
  # independently. For any platform NOT built in this release (skipped by
  # markers, or Intel failed non-blocking), copy its manifest forward from
  # the most recent prior release so /releases/latest/download/<manifest>
  # never 404s and its users stay on their last shipped build. Manifest URLs
  # are tag-pinned, so copied manifests keep pointing at valid old assets.
  publish-manifests-copyforward:
    needs: [check-flags, create-releases, build-macos, build-macos-intel, build-windows]
    if: always() && needs.create-releases.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
      REPO: anbu101/scalp-releases
    steps:
      - name: Copy forward missing platform manifests
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          MANIFESTS="latest-darwin-aarch64.json latest-darwin-x86_64.json latest-windows-x86_64.json"

          NEW_ASSETS="$(gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name' || true)"
          echo "Assets on ${TAG}:"; echo "$NEW_ASSETS"

          # DRAFT_RELEASE_20260827: exclude drafts — their assets are not
          # publicly downloadable, so a manifest copied from a draft would
          # hand users URLs they cannot fetch.
          ALL_TAGS="$(gh api "repos/${REPO}/releases?per_page=50" -q '.[] | select(.draft == false) | .tag_name')"

          for M in $MANIFESTS; do
            if echo "$NEW_ASSETS" | grep -qx "$M"; then
              echo "OK   $M already published by this release's build job."
              continue
            fi
            echo "MISS $M — searching prior releases..."
            FOUND=""
            for T in $ALL_TAGS; do
              [ "$T" = "$TAG" ] && continue
              if gh release view "$T" -R "$REPO" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$M"; then
                FOUND="$T"; break
              fi
            done
            if [ -z "$FOUND" ]; then
              echo "WARN $M not found in any prior release (first-ever build for this platform?) — skipping."
              continue
            fi
            echo "Copying $M forward from $FOUND -> $TAG"
            rm -f "$M"
            gh release download "$FOUND" -R "$REPO" -p "$M" -O "$M"
            gh release upload "$TAG" "$M" -R "$REPO" --clobber
          done
          echo "Copy-forward complete."

      # >>> DRAFT_RELEASE_20260827 BEGIN (publish the completed release) <<<
      # Runs after copy-forward, so every platform manifest is guaranteed
      # present before the release becomes "latest". Publishing an
      # already-published release (retry path) is a harmless no-op.
      - name: Publish release (updater manifests go live)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release edit "$TAG" -R "$REPO" --draft=false
          echo "Release ${TAG} is now live at releases/latest."
      # >>> DRAFT_RELEASE_20260827 END <<<
  # >>> AUTO_UPDATER_20260821 END <<<