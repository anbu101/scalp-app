name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------------
  # Gate job: read the annotated tag's message and decide whether the
  # Intel build should run this release. The deploy-scalp.command script
  # appends an [intel] marker to the tag annotation when you opt in.
  #
  # Why read the tag MESSAGE (annotation) rather than the tag NAME:
  # keeping the marker out of the version string means tags stay clean
  # (v8.0.1, not v8.0.1-intel) and the release name/assets are unaffected.
  # `git for-each-ref` prints the annotation body of the tag we're on.
  # ----------------------------------------------------------------------
  check-flags:
    runs-on: ubuntu-latest
    outputs:
      include_intel: ${{ steps.flags.outputs.include_intel }}
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse [intel] marker
        id: flags
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Read the marker from the COMMIT MESSAGE — actions/checkout always
          # has the checked-out commit, so this is reliable. (Tag annotations
          # are NOT reliably fetched in CI, which previously skipped Intel even
          # when opted in.) We also check the tag annotation as a fallback, in
          # case an older deploy put the marker only on the tag.
          COMMIT_MSG="$(git log -1 --pretty=%B 2>/dev/null || true)"
          TAG_MSG="$(git for-each-ref "refs/tags/${TAG}" --format='%(contents)' 2>/dev/null || true)"
          echo "Tag: ${TAG}"
          echo "----- commit message -----"
          echo "${COMMIT_MSG}"
          echo "----- tag annotation -----"
          echo "${TAG_MSG}"
          echo "--------------------------"
          if echo "${COMMIT_MSG} ${TAG_MSG}" | grep -qi '\[intel\]'; then
            echo "include_intel=true"  >> "$GITHUB_OUTPUT"
            echo "✅ [intel] marker found — Intel build WILL run."
          else
            echo "include_intel=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No [intel] marker — Intel build skipped (ARM + Windows only)."
          fi

  build-macos:
    needs: check-flags
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Sync Frontend Source
        run: |
          mkdir -p desktop/src-tauri/frontend
          rsync -av --exclude='node_modules' \
                    --exclude='build' \
                    --exclude='.git' \
                    --exclude='.env' \
                    --exclude='*.log' \
                    frontend/ desktop/src-tauri/frontend/
          echo "✅ Frontend synced to desktop/src-tauri/frontend/"

      - name: Build Frontend
        run: |
          cd desktop/src-tauri/frontend
          npm install
          npm run build
          echo "✅ Frontend built at desktop/src-tauri/frontend/build/"
          ls -la build/

      - name: Copy Frontend for Tauri
        run: |
          mkdir -p desktop/frontend/build
          cp -r desktop/src-tauri/frontend/build/* desktop/frontend/build/
          echo "✅ Frontend copied to desktop/frontend/build/"
          ls -la desktop/frontend/build/

      - name: Sync Backend Source
        run: |
          mkdir -p desktop/src-tauri/backend
          rsync -av --exclude='__pycache__' \
                    --exclude='*.pyc' \
                    --exclude='.pytest_cache' \
                    --exclude='venv' \
                    --exclude='dist' \
                    --exclude='build' \
                    --exclude='.git' \
                    --exclude='.env' \
                    --exclude='*.log' \
                    backend/ desktop/src-tauri/backend/
          echo "✅ Backend synced to desktop/src-tauri/backend/"

      - name: Build Backend Binary (PyInstaller - arm64)
        run: |
          cd desktop/src-tauri/backend
          pip install -r requirements.txt
          pip install pyinstaller==6.3.0
          pyinstaller scalp-backend.spec --clean --noconfirm

          # Copy to backend root (where Tauri expects it)
          cp dist/scalp-backend scalp-backend
          chmod +x scalp-backend

          echo "✅ Backend binary created:"
          file scalp-backend
          lipo -info scalp-backend
          ls -lh scalp-backend

      - name: Smoke-test backend binary (arm64)
        run: |
          cd desktop/src-tauri/backend
          echo "Launching backend to confirm it starts..."
          ./scalp-backend &
          BACK_PID=$!
          sleep 8
          if ! kill -0 "$BACK_PID" 2>/dev/null; then
            echo "❌ Backend exited within 8s — startup/bundling problem (e.g. missing hidden import)"
            wait "$BACK_PID" 2>/dev/null
            exit 1
          fi
          echo "✅ Backend still running after 8s — startup OK"
          kill "$BACK_PID" 2>/dev/null || true
          sleep 2

      - name: Verify Bundle Structure
        run: |
          echo "=== Verifying desktop/src-tauri structure ==="
          ls -la desktop/src-tauri/
          echo "=== Frontend build exists? ==="
          ls -la desktop/src-tauri/frontend/build/ | head -5
          echo "=== Backend binary exists? ==="
          ls -la desktop/src-tauri/backend/scalp-backend

      - name: Install Desktop Dependencies
        run: |
          cd desktop
          npm install

      - name: Build Tauri App (ARM only)
        run: |
          cd desktop/src-tauri
          npm run tauri build -- --target aarch64-apple-darwin

      - name: Fix backend executable permission (macOS)
        run: |
          BACKEND_BIN="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Scalp.app/Contents/Resources/backend/scalp-backend"
          chmod +x "$BACKEND_BIN"
          ls -l "$BACKEND_BIN"

      - name: Clear quarantine on app and backend
        run: |
          xattr -dr com.apple.quarantine \
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Scalp.app

      - name: Create DMG
        run: |
          cd desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          create-dmg \
            --volname "Scalp" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "Scalp-${{ github.ref_name }}.dmg" \
            "Scalp.app" || true

      - name: Create tarball
        run: |
          cd desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          tar -czf "Scalp-${{ github.ref_name }}.app.tar.gz" Scalp.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.dmg
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz

  build-macos-intel:
    needs: check-flags
    # Runs ONLY when the tag annotation carried the [intel] marker. This is
    # the cost lever: the Intel job alone bills ~270 macOS minutes (10x
    # multiplier), so it stays off unless you opt in from deploy-scalp.command.
    if: needs.check-flags.outputs.include_intel == 'true'
    runs-on: macos-15-intel
    # Non-blocking: an Intel failure must NOT stop the ARM + Windows release.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Sync Frontend Source
        run: |
          mkdir -p desktop/src-tauri/frontend
          rsync -av --exclude='node_modules' \
                    --exclude='build' \
                    --exclude='.git' \
                    --exclude='.env' \
                    --exclude='*.log' \
                    frontend/ desktop/src-tauri/frontend/
          echo "✅ Frontend synced to desktop/src-tauri/frontend/"

      - name: Build Frontend
        run: |
          cd desktop/src-tauri/frontend
          npm install
          npm run build
          echo "✅ Frontend built at desktop/src-tauri/frontend/build/"
          ls -la build/

      - name: Copy Frontend for Tauri
        run: |
          mkdir -p desktop/frontend/build
          cp -r desktop/src-tauri/frontend/build/* desktop/frontend/build/
          echo "✅ Frontend copied to desktop/frontend/build/"
          ls -la desktop/frontend/build/

      - name: Sync Backend Source
        run: |
          mkdir -p desktop/src-tauri/backend
          rsync -av --exclude='__pycache__' \
                    --exclude='*.pyc' \
                    --exclude='.pytest_cache' \
                    --exclude='venv' \
                    --exclude='venv-x86' \
                    --exclude='dist' \
                    --exclude='build' \
                    --exclude='.git' \
                    --exclude='.env' \
                    --exclude='*.log' \
                    backend/ desktop/src-tauri/backend/
          echo "✅ Backend synced to desktop/src-tauri/backend/"

      - name: Build Backend Binary (PyInstaller - x86_64 native)
        run: |
          cd desktop/src-tauri/backend
          pip install -r requirements.txt
          pip install pyinstaller==6.3.0
          pyinstaller scalp-backend.spec --clean --noconfirm

          # Copy to backend root (where Tauri expects it)
          cp dist/scalp-backend scalp-backend
          chmod +x scalp-backend

          echo "✅ Backend binary created:"
          file scalp-backend
          lipo -info scalp-backend
          ls -lh scalp-backend

      - name: Smoke-test backend binary (Intel x86_64)
        run: |
          cd desktop/src-tauri/backend
          echo "Launching backend to confirm it starts..."
          ./scalp-backend &
          BACK_PID=$!
          sleep 8
          if ! kill -0 "$BACK_PID" 2>/dev/null; then
            echo "❌ Backend exited within 8s — startup/bundling problem (this is what jaraco caused)"
            wait "$BACK_PID" 2>/dev/null
            exit 1
          fi
          echo "✅ Backend still running after 8s — startup OK"
          kill "$BACK_PID" 2>/dev/null || true
          sleep 2

      - name: Verify x86_64 backend binary
        run: |
          cd desktop/src-tauri/backend
          ARCH=$(lipo -info scalp-backend | grep -o 'x86_64' || true)
          if [ "$ARCH" != "x86_64" ]; then
            echo "❌ Backend binary is not x86_64 (got: $(lipo -info scalp-backend))"
            exit 1
          fi
          echo "✅ Verified x86_64 backend binary"

      - name: Verify Bundle Structure
        run: |
          echo "=== Verifying desktop/src-tauri structure ==="
          ls -la desktop/src-tauri/
          echo "=== Frontend build exists? ==="
          ls -la desktop/src-tauri/frontend/build/ | head -5
          echo "=== Backend binary exists? ==="
          ls -la desktop/src-tauri/backend/scalp-backend

      - name: Install Desktop Dependencies
        run: |
          cd desktop
          npm install

      - name: Build Tauri App (Intel x86_64)
        run: |
          cd desktop/src-tauri
          npm run tauri build -- --target x86_64-apple-darwin

      - name: Fix backend executable permission (macOS)
        run: |
          BACKEND_BIN="desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Scalp.app/Contents/Resources/backend/scalp-backend"
          chmod +x "$BACKEND_BIN"
          ls -l "$BACKEND_BIN"

      - name: Clear quarantine on app and backend
        run: |
          xattr -dr com.apple.quarantine \
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Scalp.app

      - name: Create DMG (Intel)
        run: |
          cd desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos
          create-dmg \
            --volname "Scalp" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "Scalp-${{ github.ref_name }}-intel.dmg" \
            "Scalp.app" || true

      - name: Create tarball (Intel)
        run: |
          cd desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos
          tar -czf "Scalp-${{ github.ref_name }}-intel.app.tar.gz" Scalp.app

      - name: Upload macOS Intel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-artifacts
          path: |
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.dmg
            desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.tar.gz

  build-windows:
    needs: check-flags
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync Frontend Source
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/frontend
          cp -r frontend/* desktop/src-tauri/frontend/ 2>/dev/null || true
          rm -rf desktop/src-tauri/frontend/node_modules 2>/dev/null || true
          rm -rf desktop/src-tauri/frontend/build 2>/dev/null || true
          echo "✅ Frontend synced to desktop/src-tauri/frontend/"

      - name: Build Frontend
        run: |
          cd desktop/src-tauri/frontend
          npm install
          npm run build

      - name: Copy Frontend for Tauri
        shell: bash
        run: |
          mkdir -p desktop/frontend/build
          cp -r desktop/src-tauri/frontend/build/* desktop/frontend/build/
          echo "✅ Frontend copied to desktop/frontend/build/"

      - name: Sync Backend Source
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/backend
          cp -r backend/* desktop/src-tauri/backend/ 2>/dev/null || true
          rm -rf desktop/src-tauri/backend/__pycache__ 2>/dev/null || true
          rm -rf desktop/src-tauri/backend/venv 2>/dev/null || true
          rm -rf desktop/src-tauri/backend/dist 2>/dev/null || true
          rm -rf desktop/src-tauri/backend/build 2>/dev/null || true
          echo "✅ Backend synced to desktop/src-tauri/backend/"

      - name: Build Backend Binary (PyInstaller)
        shell: bash
        run: |
          cd desktop/src-tauri/backend
          pip install -r requirements.txt
          pip install pyinstaller==6.3.0
          pyinstaller scalp-backend.spec --clean --noconfirm

          # Copy to backend root (where Tauri expects it)
          cp dist/scalp-backend.exe scalp-backend.exe
          echo "✅ Backend binary created:"
          ls -lh scalp-backend.exe

      - name: Smoke-test backend binary (Windows)
        shell: bash
        run: |
          cd desktop/src-tauri/backend
          echo "Launching backend to confirm it starts..."
          ./scalp-backend.exe &
          BACK_PID=$!
          sleep 8
          if ! kill -0 "$BACK_PID" 2>/dev/null; then
            echo "❌ Backend exited within 8s — startup/bundling problem"
            exit 1
          fi
          echo "✅ Backend still running after 8s — startup OK"
          taskkill //F //PID "$BACK_PID" 2>/dev/null || kill "$BACK_PID" 2>/dev/null || true
          sleep 2

      - name: Verify Bundle Structure
        shell: bash
        run: |
          echo "=== Verifying desktop/src-tauri structure ==="
          ls -la desktop/src-tauri/
          echo "=== Frontend build exists? ==="
          ls -la desktop/src-tauri/frontend/build/ | head -5
          echo "=== Backend binary exists? ==="
          ls -la desktop/src-tauri/backend/scalp-backend.exe

      - name: Install Desktop Dependencies
        run: |
          cd desktop
          npm install

      - name: Build Tauri App
        run: |
          cd desktop/src-tauri
          npm run tauri build

      - name: List build outputs
        shell: bash
        run: |
          echo "=== Listing all bundle outputs ==="
          ls -R desktop/src-tauri/target/release/bundle/ || echo "No bundle directory"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  create-release:
    needs: [build-macos, build-macos-intel, build-windows]
    # Run even if the Intel job was SKIPPED (opt-out) or failed, as long as
    # it's not a hard cancel. 'always()' covers skipped + failed Intel.
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: ./artifacts

      - name: Download macOS Intel Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-intel-artifacts
          path: ./artifacts
        # Intel may have been skipped entirely — its artifact won't exist.
        continue-on-error: true

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: ./artifacts
        continue-on-error: true

      - name: List all downloaded files
        run: |
          echo "=== All artifacts ==="
          ls -R ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/**
          body: |
            ## Installation Notes

            **macOS (Apple Silicon):** Download `.dmg` or `.app.tar.gz` (no `-intel` suffix)
            - For M1/M2/M3/M4 Macs
            - macOS 11.0 (Big Sur) or later required

            **macOS (Intel):** Download the `-intel.dmg` or `-intel.app.tar.gz`
            - For Intel-based Macs
            - macOS 11.0 (Big Sur) or later required
            - Note: Intel builds are published only for releases that include them.

            **Windows:** Download `.msi` or `-setup.exe`
            - Requires Windows 10 or later (64-bit)
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------
  # Publish installers to the public scalp-releases repo (installers only).
  # FIX: needs ALL three build jobs (not just create-release) so it cannot
  # start while the slow Intel job is still uploading. Plus a short wait on
  # the Intel artifact to absorb any upload lag. Intel skipped (opt-out) ->
  # its download just finds nothing and we publish the rest.
  # ----------------------------------------------------------------------
  publish-public-release:
    needs: [build-macos, build-macos-intel, build-windows, create-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: ./artifacts
        continue-on-error: true

      - name: Download macOS Intel Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-intel-artifacts
          path: ./artifacts
        continue-on-error: true

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: ./artifacts
        continue-on-error: true

      - name: Check artifacts exist
        id: check
        run: |
          if [ -d ./artifacts ] && [ -n "$(find ./artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.tar.gz' \) 2>/dev/null)" ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "=== Publishing these to the public releases repo ==="
            find ./artifacts -type f
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No installer artifacts found — skipping public publish."
          fi

      - name: Publish to public scalp-releases repo
        if: steps.check.outputs.has_files == 'true'
        uses: softprops/action-gh-release@v1
        with:
          repository: anbu101/scalp-releases
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ./artifacts/**
          body: |
            Scalp Terminal ${{ github.ref_name }}

            **macOS (Apple Silicon):** `.dmg` or `.app.tar.gz` (no `-intel` suffix) — M1/M2/M3/M4.
            **macOS (Intel):** `-intel.dmg` / `-intel.app.tar.gz` — only present when the release includes an Intel build.
            **Windows:** `.msi` or `-setup.exe` — Windows 10+ (64-bit).
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}