# .github/workflows/ci.yml — ── CI_20261117 ── (TD-041)
#
# Tests and builds every push to main, and on demand (Actions tab -> CI -> Run workflow).
# Read-only by design: no secrets, no broker credentials, nothing that talks to Kite.
# Live probes and Mac-only data suites are skipped by scripts/ci/run_ci_suites.py
# (SKIP / KNOWN_FAIL lists, each with its reason), and every suite gets an empty HOME.
# Releases stay in build-release.yml (tags only); this workflow never builds or ships the app.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Kolkata                  # the trading Macs' clock; some suites read local time
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    name: Backend suites ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/ci/requirements-ci.txt
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt -r scripts/ci/requirements-ci.txt
      - name: Run suites (one line per suite, failures in full)
        run: python scripts/ci/run_ci_suites.py backend --shard "${{ matrix.shard }}/3" -j 4 --timeout 600

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "18"        # same as build-release.yml
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: react-scripts build
        working-directory: frontend
        env:
          CI: "false"               # warnings stay warnings, as in desktop/build-scalp.sh
        run: |
          set -o pipefail
          if npm run build > build.log 2>&1; then
            if grep -q "Compiled with warnings" build.log; then
              echo "::warning::frontend compiled with warnings"
              grep -A40 "Compiled with warnings" build.log | head -n 40
            fi
            echo "PASS frontend: react-scripts build"
            echo "**PASS** frontend: react-scripts build" >> "$GITHUB_STEP_SUMMARY"
          else
            tail -n 40 build.log
            echo "FAIL frontend: react-scripts build"
            echo "**FAIL** frontend: react-scripts build" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  tooling:
    name: pre-commit checks + tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # the pushed range, for the backup-file check
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: scripts/ci/requirements-ci.txt
      - name: Install pre-commit and pytest
        run: python -m pip install -r scripts/ci/requirements-ci.txt
      - name: Look for .pre-commit-config.yaml (TD-042)
        id: cfg
        run: |
          if [ -f .pre-commit-config.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SKIP pre-commit: no .pre-commit-config.yaml in this commit"
            echo "SKIP pre-commit: no .pre-commit-config.yaml in this commit" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/cache@v6
        if: steps.cfg.outputs.present == 'true'
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-py310-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit on every file (ruff errors, dual tree)
        if: steps.cfg.outputs.present == 'true'
        env:
          SKIP: no-backup-files,repo-map-refresh    # the tracked .bak backlog (DEF-046) / the map has its own check below
        run: pre-commit run --all-files --show-diff-on-failure --color always
      - name: No backup files in the pushed commits
        if: steps.cfg.outputs.present == 'true'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          pre-commit run no-backup-files --from-ref "$base" --to-ref HEAD --color always
      - name: REPO_MAP.md current
        run: |
          if [ -f scripts/gen_repo_map.py ]; then
            if python scripts/gen_repo_map.py --check; then
              echo "PASS REPO_MAP.md current"
            else
              echo "::warning file=REPO_MAP.md::REPO_MAP.md is stale — run python3 scripts/gen_repo_map.py and commit it"
            fi
          else
            echo "SKIP REPO_MAP.md: no scripts/gen_repo_map.py"
          fi
      - name: Tooling tests (scripts/)
        run: python scripts/ci/run_ci_suites.py scripts -j 2 --timeout 300
