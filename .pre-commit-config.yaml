# .pre-commit-config.yaml — ── PRECOMMIT_20261117 ── (TD-042)
# ── PUSH_ANYTIME_20261118 ── (TD-047) market-hours push block removed: push any time
# ── RELIABILITY_GATE_20261118 ── (TD-048/049) reliability checklist on commit-msg (install once more: pre-commit install)
# Install once per clone:
#   pip install pre-commit
#   pre-commit install
# Run by hand:  pre-commit run --all-files      (skip one hook: SKIP=<id> git commit ...)
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check            # rules in ruff.toml: errors only, no --fix

  - repo: local
    hooks:
      - id: no-backup-files
        name: no .bak-* / .staging-* / __pycache__ / .DS_Store
        entry: python scripts/hooks/check_forbidden_files.py
        language: python
        pass_filenames: true

      - id: dual-tree-parity
        name: dual tree (backend/app, frontend == desktop/src-tauri copies)
        entry: python scripts/hooks/check_dual_tree.py
        language: python
        files: ^(backend/app/|frontend/)
        always_run: true          # also sees commits that only delete files
        pass_filenames: true

      - id: repo-map-refresh
        name: REPO_MAP.md current
        entry: python scripts/hooks/repo_map_refresh.py
        language: python
        always_run: true
        pass_filenames: false
        verbose: true

      - id: reliability-checklist   # ── RELIABILITY_GATE_20261118 ── (TD-048/049) commit-msg: diff-triggered checklist + gate
        name: reliability checklist (scripts/checklist/items.py from HEAD; mode in scripts/checklist/MODE)
        entry: python3 scripts/hooks/reliability_checklist.py
        language: system            # system python3: CL-07 runs the fleet suites with the app's packages
        stages: [commit-msg]
        always_run: true
        verbose: true
